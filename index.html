<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191a1b">
  <meta name="description" content="Walk through a virtual museum and hear five pieces of space history tell their stories.">
  <title>Still Out There | A Walk Through Space History</title>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <main id="lobby">
    <div class="lobby-inner">
      <header class="lobby-header">
        <span>NASA Space Apps Challenge project</span>
        <button class="quiet" id="intro-sound" aria-pressed="true">Sound on</button>
      </header>
      <div class="lobby-exhibition">
        <div class="opening">
          <h1>Still Out<br>There</h1>
          <p>Explore five artifacts from the Moon, Mars, and interstellar space. Walk up to each exhibit to hear its story.</p>
          <div class="entrance-actions">
            <button class="primary" id="enter"><span id="enter-label">Enter museum</span> <span aria-hidden="true">→</span></button>
            <button class="browse-button" id="open-exhibits">Browse exhibits</button>
          </div>
        </div>
        <figure class="voyager-figure">
          <div class="voyager-image">
            <img src="./exhibits/entrance.webp" width="2000" height="1125" alt="A Voyager spacecraft with its white dish antenna facing a field of stars." fetchpriority="high">
          </div>
          <figcaption>
            <span><strong>Voyager in deep space</strong> <span class="image-type">Artist’s concept</span></span>
            <a href="https://science.nasa.gov/image-detail/pia17462/" target="_blank" rel="noreferrer">NASA/JPL-Caltech</a>
          </figcaption>
        </figure>
      </div>
    </div>
  </main>
  <section id="walk" aria-label="Museum controls" hidden>
    <header class="tour-header"><button class="quiet" id="back">Entrance</button><span id="visited-count">0 / 5 explored</span><div><button class="quiet" id="tour-sound" aria-pressed="true">Sound on</button><button class="quiet" id="tour-exhibits">Exhibits</button></div></header>
    <div id="reticle" aria-hidden="true"></div>
    <div id="distance" hidden><div class="distance-label"><strong id="target-name"></strong><span id="target-range"></span></div><div class="meter"><span id="distance-fill"></span></div><small id="distance-hint">Walk closer to hear the story</small></div>
    <div class="touch-controls" aria-label="Touch movement">
      <button data-move="KeyW" aria-label="Walk forward">↑</button><button data-move="KeyA" aria-label="Step left">←</button><button data-move="KeyS" aria-label="Walk backward">↓</button><button data-move="KeyD" aria-label="Step right">→</button>
    </div>
    <div class="control-hint" id="control-hint"></div>
  </section>
  <aside id="story" aria-label="Artifact story" hidden>
    <div class="story-top"><span class="overline" id="story-tag"></span><button id="close-story" class="quiet" aria-label="Close story">Close</button></div>
    <h2 id="story-title"></h2><p id="caption" aria-live="polite"></p>
    <p id="audio-notice" role="status" hidden></p>
    <div class="meter" id="story-meter"><span id="story-fill"></span></div>
    <div class="story-actions"><button class="quiet" id="replay">Replay</button><button class="quiet" id="transcript">Full story</button><button class="quiet" id="activity"></button></div>
    <div class="experiment" id="experiment" hidden></div>
    <a class="source" id="story-source" target="_blank" rel="noreferrer">Mission source →</a>
  </aside>
  <dialog id="directory">
    <div class="story-top"><span class="overline">MUSEUM DIRECTORY</span><button id="close-directory" class="quiet" aria-label="Close directory">Close</button></div>
    <h2>Choose an exhibit</h2>
    <div id="exhibit-list"></div>
    <a class="source" href="https://www.spaceappschallenge.org/2026/challenges/nasas-discarded-equipment-storytelling/" target="_blank" rel="noreferrer">2026 Space Apps challenge →</a>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
